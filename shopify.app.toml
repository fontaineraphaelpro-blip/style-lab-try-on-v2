# ======================================
# shopify.app.toml - Avec App Proxy
# ======================================

client_id = "85e1a9dba888450e33b84fbb067bc3a5"
name = "Try-On StyleLab"
application_url = "https://style-lab-try-on-v2-1.onrender.com"
embedded = true

[access_scopes]
scopes = "write_products,read_products"

[auth]
redirect_urls = [
  "https://style-lab-try-on-v2-1.onrender.com/auth/callback",
  "https://style-lab-try-on-v2-1.onrender.com/auth/shopify/callback",
  "https://style-lab-try-on-v2-1.onrender.com/api/auth/callback"
]

# === APP PROXY (ESSENTIEL POUR MODE CLIENT) ===
[app_proxy]
url = "https://style-lab-try-on-v2-1.onrender.com"
subpath = "tryon"
prefix = "apps"

[webhooks]
api_version = "2025-01"

[[webhooks.subscriptions]]
topics = [
  "app/uninstalled",
  "products/update"
]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = [
  "customers/redact"
]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = [
  "shop/redact"
]
uri = "/webhooks/shop/redact"