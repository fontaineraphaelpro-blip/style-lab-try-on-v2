# ======================================
# shopify.app.toml - Avec App Proxy
# ======================================

client_id = "85e1a9dba888450e33b84fbb067bc3a5"
name = "Try-On StyleLab"
application_url = "https://style-lab-try-on-v2-production.up.railway.app"
embedded = true

[access_scopes]
# Scopes nécessaires pour l'app
scopes = "write_products,read_products,read_orders,write_orders"

[auth]
redirect_urls = [
  "https://style-lab-try-on-v2-production.up.railway.app/auth/callback",
  "https://style-lab-try-on-v2-production.up.railway.app/auth/shopify/callback",
  "https://style-lab-try-on-v2-production.up.railway.app/api/auth/callback",
  "https://style-lab-try-on-v2-1.onrender.com/auth/callback",
  "https://style-lab-try-on-v2-1.onrender.com/auth/shopify/callback",
  "https://style-lab-try-on-v2-1.onrender.com/api/auth/callback"
]

# === APP PROXY (ESSENTIEL POUR MODE CLIENT) ===
[app_proxy]
url = "https://style-lab-try-on-v2-production.up.railway.app"
subpath = "tryon"
prefix = "apps"

[webhooks]
api_version = "2025-01"

[[webhooks.subscriptions]]
topic = "app/uninstalled"
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topic = "products/update"
uri = "/webhooks/products/update"

[[webhooks.subscriptions]]
topic = "app_charges/activate"
uri = "/webhooks/billing/charges/activate"

[[webhooks.subscriptions]]
compliance_topic = "customers/data_request"
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topic = "customers/redact"
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topic = "shop/redact"
uri = "/webhooks/shop/redact"